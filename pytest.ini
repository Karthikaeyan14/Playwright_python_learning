[pytest]
pythonpath=.
addopts = --strict-markers
markers =
    valid_login_details: valid login test
    invalid_login_details: invalid login test
    empty_login_details: empty login test
    invalid_email_details:invalid email details
    valid_product:valid product details
    invalid_product:invalid product details
    valid_price:valid product price
    

filterwarnings =
    error
    ignore::UserWarning
    ignore:function ham\(\) is deprecated:DeprecationWarning
